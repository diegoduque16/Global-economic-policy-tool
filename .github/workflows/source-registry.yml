name: Build economic source registry
on:
  workflow_dispatch:
  push:
    paths:
      - 'open_data/expanded_source_catalog.csv'
      - 'open_data/ingest.py'
      - 'tests/test_open_data_v07.py'
      - 'atlas_web/**'
      - 'atlas_public/**'
      - 'tests/test_atlas_public.py'
      - 'tests/test_atlas_research_export.py'
      - 'open_data/wdi_indicators.json'
      - '.github/workflows/world-bank.yml'
      - 'research/query_atlas_wdi.py'
      - 'tests/test_atlas_web.py'
      - 'scripts/audit_public_wdi_series.py'
      - 'scripts/build_source_registry.py'
      - 'research/atlas1_reconcile_inventory.py'
      - 'research/wid_23_source_manifest.json'
      - 'research/wid_refresh_20261103_source_fingerprints.json'
      - 'research/audit_wid_revisions.py'
      - 'tests/test_wid_revision_audit.py'
      - 'scripts/atlas_data_watchdog.py'
      - '.github/workflows/atlas-data-pipeline-watchdog.yml'
      - '.github/workflows/atlas-wid-expand-20-countries.yml'
      - 'tests/test_source_registry_reconciliation.py'
      - 'tests/test_atlas_data_watchdog.py'
      - 'scripts/ilostat_native_profile.py'
      - 'tests/test_ilostat_native_profile.py'
      - '.github/workflows/atlas-ilostat-bulk-resumable-ingestion.yml'
      - '.github/workflows/source-registry.yml'
  schedule:
    - cron: '43 10 * * 1'
permissions:
  contents: read
jobs:
  build-registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify source-linkage statuses cannot be overclaimed
        run: |
          python -m unittest discover -s tests -p 'test_source_registry_reconciliation.py' -v
          python -m unittest discover -s tests -p 'test_wid_revision_audit.py' -v
          python -m unittest discover -s tests -p 'test_atlas_data_watchdog.py' -v
          python -m unittest discover -s tests -p 'test_ilostat_native_profile.py' -v
          python - <<'PY_ILOSTAT_EMBED'
          from pathlib import Path
          text = Path('.github/workflows/atlas-ilostat-bulk-resumable-ingestion.yml').read_text()
          begin = "          python - <<'PYCODE'\n"
          end = "\n          PYCODE"
          assert text.count(begin) == 1 and text.count(end) == 1
          code = text.split(begin, 1)[1].split(end, 1)[0]
          assert all(line.startswith('          ') or not line for line in code.splitlines())
          script = '\n'.join(line[10:] for line in code.splitlines()) + '\n'
          namespace = {'__name__': 'atlas_ilostat_embedded_offline_test'}
          exec(compile(script, 'ILOSTAT embedded GitHub Action source', 'exec'), namespace)
          namespace['test']()
          print('ATLAS_ILOSTAT_EMBEDDED_SCRIPT_OFFLINE_VERIFIED')
          PY_ILOSTAT_EMBED
          python -m unittest discover -s tests -p 'test_open_data_v07.py' -v
          python -m unittest discover -s tests -p 'test_atlas_web.py' -v
          node --check atlas_web/static/app.js
          python -m unittest discover -s tests -p 'test_atlas_public.py' -v
          python -m unittest discover -s tests -p 'test_atlas_research_export.py' -v
          python atlas_public/build_site.py
          python - <<'PY_SQLITE'
          import hashlib, json, zipfile
          from pathlib import Path
          site = Path('atlas_public/dist')
          html = (site/'index.html').read_text()
          assert '/research/atlas_wdi_research.sqlite.zip' in html
          archive = site/'research/atlas_wdi_research.sqlite.zip'
          assert archive.is_file() and archive.stat().st_size < 25_000_000
          manifest = json.loads((site/'research/research_manifest.json').read_text())
          info = manifest['sqlite_research_edition']
          assert info['all_observations'] == 300240
          assert info['indicators'] == 32
          assert info['country_aggregate_separated_in_sql_views'] is True
          assert manifest['output_files'][archive.name]['sha256'] == hashlib.sha256(archive.read_bytes()).hexdigest()
          with zipfile.ZipFile(archive) as content:
              assert content.namelist() == ['atlas_wdi_research.sqlite']
              assert content.testzip() is None
          print('ATLAS_SQLITE_RESEARCH_DOWNLOAD_VERIFIED', info['all_observations'],
                info['archive_bytes'], 'bytes')
          PY_SQLITE
          python - <<'PY_WDI_SCOPE'
          import json
          from pathlib import Path
          baseline=json.loads(Path('atlas_public/wdi_20261109_definitions.json').read_text())
          expanded=json.loads(Path('open_data/wdi_indicators.json').read_text())
          b={x for group in baseline.values() for x in group}
          e={x for group in expanded.values() for x in group}
          assert len(b)==32 and len(e)==59, (len(b),len(e))
          assert b.issubset(e) and len(e-b)==27
          assert all(len(code)>=4 and '.' in code for code in e)
          print('WDI_PUBLIC_PINNED',len(b),'RESEARCH_SOURCE_CATALOG',len(e))
          PY_WDI_SCOPE
          node --check atlas_public/public_adapter.js
      - name: Validate and normalize catalog
        run: python scripts/build_source_registry.py
      - name: Upload structured registry
        uses: actions/upload-artifact@v4
        with:
          name: economic-source-registry-${{ github.run_number }}
          path: research/source_registry/*
          if-no-files-found: error
          retention-days: 90
