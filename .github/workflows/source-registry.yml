name: Build economic source registry
on:
  workflow_dispatch:
  push:
    paths:
      - 'open_data/expanded_source_catalog.csv'
      - 'scripts/build_source_registry.py'
      - 'research/atlas1_reconcile_inventory.py'
      - 'research/wid_23_source_manifest.json'
      - 'research/wid_refresh_20261103_source_fingerprints.json'
      - 'research/audit_wid_revisions.py'
      - 'tests/test_wid_revision_audit.py'
      - 'scripts/atlas_data_watchdog.py'
      - '.github/workflows/atlas-data-pipeline-watchdog.yml'
      - '.github/workflows/atlas-wid-expand-20-countries.yml'
      - 'tests/test_source_registry_reconciliation.py'
      - '.github/workflows/source-registry.yml'
  schedule:
    - cron: '43 10 * * 1'
permissions:
  contents: read
jobs:
  build-registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read-only private checkpoint compatibility check (temporary branch validation)
        env:
          RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RCLONE_CONFIG_B64" || { echo "Configured private source credentials unavailable" >&2; exit 1; }
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq rclone >/dev/null
          umask 077
          temp="$(mktemp -d)"
          trap 'rm -rf "$temp"' EXIT
          printf '%s' "$RCLONE_CONFIG_B64" | base64 --decode > "$temp/rclone.conf"
          export RCLONE_CONFIG="$temp/rclone.conf"
          rclone copyto 'onedrive:Diego/economic research database/atlas/ilostat-bulk-v1/checkpoint/state.json' "$temp/state.json" --retries 3 >/dev/null
          python - "$temp/state.json" <<'PY_CHECKPOINT'
          import json
          import sys
          from pathlib import Path
          from datetime import datetime,timezone
          from scripts.atlas_data_watchdog import verify_ilostat
          state=json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          report=verify_ilostat(state,datetime.now(timezone.utc))
          assert report['status']=='VERIFIED_RAW_SOURCE_FILES_NOT_HARMONIZED'
          assert report['verified_compressed_files']>=900
          print('PRIVATE_CHECKPOINT_PATH_BINDING_VALID',report['verified_compressed_files'],'of',report['official_bulk_files'])
          PY_CHECKPOINT
      - name: Verify source-linkage statuses cannot be overclaimed
        run: |
          python -m unittest discover -s tests -p 'test_source_registry_reconciliation.py' -v
          python -m unittest discover -s tests -p 'test_wid_revision_audit.py' -v
          python -m unittest discover -s tests -p 'test_atlas_data_watchdog.py' -v
      - name: Validate and normalize catalog
        run: python scripts/build_source_registry.py
      - name: Upload structured registry
        uses: actions/upload-artifact@v4
        with:
          name: economic-source-registry-${{ github.run_number }}
          path: research/source_registry/*
          if-no-files-found: error
          retention-days: 90
