name: Build economic source registry
on:
  workflow_dispatch:
  push:
    paths:
      - 'open_data/expanded_source_catalog.csv'
      - 'open_data/ingest.py'
      - 'open_data/wdi_geography.py'
      - 'tests/test_open_data_v07.py'
      - 'scripts/build_source_registry.py'
      - 'research/atlas1_reconcile_inventory.py'
      - 'research/wid_23_source_manifest.json'
      - 'research/wid_refresh_20261103_source_fingerprints.json'
      - 'research/audit_wid_revisions.py'
      - 'tests/test_wid_revision_audit.py'
      - 'scripts/atlas_data_watchdog.py'
      - '.github/workflows/atlas-data-pipeline-watchdog.yml'
      - '.github/workflows/atlas-wid-expand-20-countries.yml'
      - 'tests/test_source_registry_reconciliation.py'
      - 'tests/test_atlas_data_watchdog.py'
      - '.github/workflows/source-registry.yml'
  schedule:
    - cron: '43 10 * * 1'
permissions:
  contents: read
  actions: read
jobs:
  build-registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Temporary live World Bank provider geography crosswalk check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wdi-real-data"
          gh run download 42581151428 --repo "$GITHUB_REPOSITORY" --name world-bank-wdi-6 --dir "$RUNNER_TEMP/wdi-real-data"
          python - <<'PY_LIVE_WDI_GEO'
          import csv
          import os
          from collections import Counter
          from pathlib import Path
          import urllib.request
          from open_data.wdi_geography import BASE, metadata_page, country_map, classify_observed
          source_pages=[]
          for page in range(1,13):
              url=BASE+f'?format=json&per_page=500&page={page}'
              req=urllib.request.Request(url,headers={'User-Agent':'GlobalEconomicPolicyAtlas/1.0'})
              with urllib.request.urlopen(req,timeout=45) as response:
                  raw=response.read()
              pages, _, _=metadata_page(raw,page)
              source_pages.append(raw)
              if page == pages: break
          provider=country_map(source_pages)
          path=Path(os.environ['RUNNER_TEMP'])/'wdi-real-data'/'processed'/'wdi_panel.csv'
          with path.open(newline='',encoding='utf-8') as stream:
              counts=Counter(row['country_iso3'] for row in csv.DictReader(stream))
          rows,summary=classify_observed(provider,dict(counts))
          assert len(rows)==261 and sum(counts.values())==300240
          assert summary['aggregate_codes']>0 and summary['country_or_territory_codes']>0
          import json
          print('LIVE_WDI_PROVIDER_GEOGRAPHY_AUDIT',json.dumps(summary,sort_keys=True))
          print('UNRESOLVED_WDI_GEOGRAPHY_CODES',[x['code'] for x in rows if x['geography_type']=='UNRESOLVED_WORLD_BANK_METADATA'])
          PY_LIVE_WDI_GEO
          rm -rf "$RUNNER_TEMP/wdi-real-data"
      - name: Temporary full WDI replay from checksum-pinned pages with fresh provider geography metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wdi-source" "$RUNNER_TEMP/wdi-replay"
          gh run download 42581151428 --repo "$GITHUB_REPOSITORY" --name world-bank-wdi-6 --dir "$RUNNER_TEMP/wdi-source"
          python - <<'PY_WDI_REPLAY'
          import json,os,sys,urllib.request
          from pathlib import Path
          sys.path.insert(0,str(Path('open_data').resolve()))
          from wdi_geography import BASE
          import ingest
          import scripts.atlas_data_watchdog as audit
          root=Path(os.environ['RUNNER_TEMP'])
          old=root/'wdi-source'
          old_report=json.loads((old/'run_report.json').read_text())
          byurl={x['url']:old/'raw'/x['file'] for x in old_report['manifest']}
          assert len(byurl)==576 and old_report['observations']==300240
          groups=json.loads(Path('open_data/wdi_indicators.json').read_text())
          indicators=list(dict.fromkeys(k for group in groups.values() for k in group))
          def replay(url):
              if url in byurl:
                  return byurl[url].read_bytes()
              if url.startswith(BASE+'?'):
                  req=urllib.request.Request(url,headers={'User-Agent':'GlobalEconomicPolicyAtlas/1.0'})
                  with urllib.request.urlopen(req,timeout=60) as response:
                      return response.read()
              raise ValueError('Unexpected source URL during original-page replay')
          dest=root/'wdi-replay'
          result=ingest.run(dest,'all',1960,2026,indicators,replay)
          if result['errors'] or result['conflicts'] or result['observations']!=300240:
              raise ValueError('Original source-page replay failed: '+str(result['errors'][:2]))
          out=audit.validate_wdi_download(dest)
          assert out['source_metadata_version_verified'] and out['country_vs_aggregate_resolved']
          assert out['country_or_territory_codes']==217 and out['aggregate_codes']==44
          assert out['aggregate_observation_rows']==54913 and out['unresolved_codes']==0
          print('LIVE_WDI_REPLAY_PROVENANCE_VALIDATED',json.dumps({
            'original_numeric_rows':out['observations'],
            'source_raw_pages':out['raw_pages'],
            'country_or_territory_codes':out['country_or_territory_codes'],
            'aggregate_codes':out['aggregate_codes'],
            'unresolved_codes':out['unresolved_codes'],
            'canonical_warehouse_updated':out['canonical_integration_verified']},sort_keys=True))
          PY_WDI_REPLAY
          rm -rf "$RUNNER_TEMP/wdi-source" "$RUNNER_TEMP/wdi-replay"
      - name: Verify source-linkage statuses cannot be overclaimed
        run: |
          python -m unittest discover -s tests -p 'test_source_registry_reconciliation.py' -v
          python -m unittest discover -s tests -p 'test_wid_revision_audit.py' -v
          python -m unittest discover -s tests -p 'test_atlas_data_watchdog.py' -v
          python -m unittest discover -s tests -p 'test_open_data_v07.py' -v
      - name: Validate and normalize catalog
        run: python scripts/build_source_registry.py
      - name: Upload structured registry
        uses: actions/upload-artifact@v4
        with:
          name: economic-source-registry-${{ github.run_number }}
          path: research/source_registry/*
          if-no-files-found: error
          retention-days: 90
