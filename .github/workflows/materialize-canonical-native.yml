name: Materialize five source-native datasets in canonical warehouse

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/materialize-canonical-native.yml'
      - 'warehouse/wdi_native_extension.py'
  workflow_dispatch:
    inputs:
      canonical_run_id:
        description: 'Successful canonical warehouse run ID (includes all five staged datasets)'
        required: true
        type: string
        default: '40616230528'
      operation:
        description: 'Use previous five-source job, re-run WID attachment, or extend WID attachment with original WDI'
        type: choice
        required: true
        default: historical_five
        options:
          - historical_five
          - wid_attach
          - wdi_attach

permissions:
  actions: read
  contents: read

concurrency:
  group: materialize-canonical-native
  cancel-in-progress: false

jobs:
  materialize:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'historical_five'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_RUN_ID: ${{ inputs.canonical_run_id }}
      ONEDRIVE_TARGET: 'onedrive:Diego/economic research database'
    steps:
      - name: Checkout verified source code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test source-native schema without external downloads
        run: python warehouse/native_materialize.py --self-test
      - name: Validate canonical source run and download its exact artifact
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]
          conclusion=$(gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN_ID" --jq '.conclusion')
          name=$(gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN_ID" --jq '.name')
          branch=$(gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN_ID" --jq '.head_branch')
          source_repo=$(gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN_ID" --jq '.head_repository.full_name')
          test "$conclusion" = success
          test "$name" = 'Build canonical economic warehouse inventory'
          test "$branch" = main
          test "$source_repo" = "$GH_REPO"
          mkdir -p source_package
          gh run download "$SOURCE_RUN_ID" --repo "$GH_REPO" \
            --name "canonical-warehouse-$SOURCE_RUN_ID" --dir source_package
          archive="source_package/canonical-20261028-40616230528.tar.gz"
          # For this certified starting snapshot, pin the exact hash audited in
          # the previous GitHub run and OneDrive byte-for-byte verification.
          if [ "$SOURCE_RUN_ID" = '40616230528' ]; then
            test -f "$archive"
            echo '8f6ae9a3674045851c0726aa6415014389082a6309e784c77753542d7147072f  source_package/canonical-20261028-40616230528.tar.gz' | sha256sum -c -
          else
            mapfile -d '' -t found < <(find source_package -type f -name 'canonical-*.tar.gz' -print0)
            test "${#found[@]}" -eq 1
            archive="${found[0]}"
          fi
          echo "SOURCE_ARCHIVE=$archive" >> "$GITHUB_ENV"
      - name: Materialize audited five-source tables into a new SQLite snapshot
        shell: bash
        run: |
          set -euo pipefail
          id="canonical-native-$(date -u +%Y%m%d)-$GITHUB_RUN_ID"
          echo "NATIVE_SNAPSHOT_ID=$id" >> "$GITHUB_ENV"
          python warehouse/native_materialize.py \
            --archive "$SOURCE_ARCHIVE" --output native_output --snapshot-id "$id"
      - name: Verify unchanged analytic observations and queryable native row counts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,sqlite3
          from pathlib import Path
          root=Path('native_output')/os.environ['NATIVE_SNAPSHOT_ID']
          r=json.loads((Path('native_output')/(os.environ['NATIVE_SNAPSHOT_ID']+'.integration_report.json')).read_text())
          db=root/'canonical_warehouse'/'warehouse.sqlite'
          with sqlite3.connect(f'file:{db}?mode=ro',uri=True) as con:
              assert con.execute('SELECT COUNT(*) FROM observations').fetchone()[0]==2780117
              assert con.execute('SELECT COUNT(*) FROM source_files').fetchone()[0]==24
              assert con.execute('SELECT COUNT(*) FROM native_sources').fetchone()[0]==5
              assert con.execute('SELECT COUNT(*) FROM native_records').fetchone()[0]==2104609
              assert con.execute('PRAGMA integrity_check').fetchone()[0]=='ok'
          assert r['source_native_unharmonized_rows']==2104609
          assert r['warehouse_modified_observations'] is False
          print('Verified existing 2,780,117 observations and 2,104,609 queryable source-native rows')
          PY
      - name: Save immutable integrated snapshot and audit as GitHub artifact
        uses: actions/upload-artifact@v4
        with:
          name: canonical-native-${{ github.run_id }}
          path: |
            native_output/*.tar.gz
            native_output/*.integration_report.json
          retention-days: 90
          if-no-files-found: error
      - name: Back up derived snapshot to existing private OneDrive and verify exact bytes
        env:
          RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RCLONE_CONFIG_B64" || { echo 'Missing existing OneDrive secret' >&2; exit 1; }
          sudo apt-get update -qq
          sudo apt-get install -y -qq rclone
          umask 077
          mkdir -p "$RUNNER_TEMP/rclone"
          printf '%s' "$RCLONE_CONFIG_B64" | base64 --decode > "$RUNNER_TEMP/rclone/rclone.conf"
          chmod 600 "$RUNNER_TEMP/rclone/rclone.conf"
          export RCLONE_CONFIG="$RUNNER_TEMP/rclone/rclone.conf"
          archive="native_output/$NATIVE_SNAPSHOT_ID.tar.gz"
          remote="$ONEDRIVE_TARGET/snapshots/$NATIVE_SNAPSHOT_ID.tar.gz"
          rclone copyto "$archive" "$remote" --retries 3 --low-level-retries 10
          rclone copyto "$remote" "$RUNNER_TEMP/native-verify.tar.gz" --retries 3
          cmp "$archive" "$RUNNER_TEMP/native-verify.tar.gz"
          sha256sum "$archive" > "native_output/$NATIVE_SNAPSHOT_ID.tar.gz.sha256"
          rclone copyto "native_output/$NATIVE_SNAPSHOT_ID.tar.gz.sha256" "$remote.sha256"
          rclone copyto "native_output/$NATIVE_SNAPSHOT_ID.integration_report.json" \
            "$ONEDRIVE_TARGET/snapshots/$NATIVE_SNAPSHOT_ID.integration_report.json"
          echo "Verified OneDrive derived snapshot at $remote"
      - name: Remove temporary OAuth credentials
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/rclone/rclone.conf"

  extend-verified-wid-source-native:
    # Add source-native WID rows in an ATTACH-able native SQLite layer; NEVER copy the >10GB historical SQLite.
    # The previous manual five-source materializer is left unchanged.
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'wid_attach'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG_B64 }}
    steps:
      - name: Check out certified Atlas warehouse extension code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test native WID insertion and immutable country source guards offline
        run: |
          python -m warehouse.wid_native_extension --self-test
          python -m unittest discover -s tests -p 'test_wid_native_extension.py' -v
      - name: Verify original certified warehouse identity and retrieve 15 WID metadata receipts
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GH_REPO/actions/runs/40617910011" --jq '.conclusion')" = success
          test "$(gh api "repos/$GH_REPO/actions/runs/40617910011" --jq '.name')" = 'Materialize five source-native datasets in canonical warehouse'
          test "$(gh api "repos/$GH_REPO/actions/runs/40617910011" --jq '.head_branch')" = main
          # Historical parent is certified by run ID and pinned SHA256 from prior
          # independently validated original archive. No redundant >10GB unzip.
          for run in 43640485476 43643338607 43681169408; do
            test "$(gh api "repos/$GH_REPO/actions/runs/$run" --jq '.conclusion')" = success
            test "$(gh api "repos/$GH_REPO/actions/runs/$run" --jq '.head_branch')" = main
            name=$(gh api "repos/$GH_REPO/actions/runs/$run" --jq '.name')
            case "$name" in "Atlas - Expand WID"*) ;; *) echo "Wrong WID production run: $name" >&2; exit 1;; esac
            mkdir -p "receipts/$run"
            gh run download "$run" --repo "$GH_REPO" --pattern 'wid-expansion-*' --dir "receipts/$run"
            test "$(find "receipts/$run" -type f -name '*.json' | wc -l)" -eq 5
          done
      - name: Install existing private OneDrive connection
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RCLONE_CONFIG_B64"
          sudo apt-get update -qq
          sudo apt-get install -y -qq rclone
          umask 077
          mkdir -p "$RUNNER_TEMP/wid-native-rclone"
          printf '%s' "$RCLONE_CONFIG_B64" | base64 --decode > "$RUNNER_TEMP/wid-native-rclone/rclone.conf"
          chmod 600 "$RUNNER_TEMP/wid-native-rclone/rclone.conf"
          echo "RCLONE_CONFIG=$RUNNER_TEMP/wid-native-rclone/rclone.conf" >> "$GITHUB_ENV"
      - name: Index 60 official WID sources using ATTACH-able native SQLite schema
        shell: bash
        run: |
          set -euo pipefail
          id="atlas-wid-native-shard-$(date -u +%Y%m%d)-$GITHUB_RUN_ID"
          echo "WID_NATIVE_SNAPSHOT_ID=$id" >> "$GITHUB_ENV"
          python -m warehouse.wid_native_extension \
            --shard-only \
            --receipts receipts \
            --out native_output \
            --snapshot-id "$id"
      - name: Assert original analytical observations unchanged and new native rows verified
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY_WID_VERIFY'
          import json, os
          from pathlib import Path
          root=Path('native_output')
          sid=os.environ['WID_NATIVE_SNAPSHOT_ID']
          doc=json.loads((root/(sid+'.integration_report.json')).read_text())
          assert doc['parent_native_snapshot_run_id']==40617910011
          assert doc['source_wid_collection_runs']==[43640485476,43643338607,43681169408]
          assert doc['canonical_observations_unchanged']==2780117
          assert doc['added_wid_country_source_files']==60
          assert doc['added_native_wid_numeric_records']==40908
          assert doc['private_shard_native_records']==40908
          assert doc['logical_atlas_native_records_with_attachment']==2145517
          assert doc['storage_mode']=='ATLAS_NATIVE_ATTACHABLE_SQLITE_SHARD_PARENT_UNCHANGED'
          assert doc['pinned_parent_archive_sha256']=='dfe43456207e8681c4a79470d39578718c51670ceeb43cf4c68a379fdc61d17b'
          assert doc['source_original_csv_sha256_verified_for_each_country'] is True
          assert doc['original_canonical_sqlite_was_modified'] is False
          assert doc['private_attachment_not_a_physical_single_db_merge'] is True
          assert doc['public_release'] is False
          assert doc['research_ready_harmonized'] is False
          assert len(doc['archive_sha256'])==64
          assert (root/(sid+'.tar.gz')).is_file()
          print('WID_60_PRIVATE_ATTACHABLE_SQLITE_SOURCE_ROWS_VERIFIED',{
              'verified_countries':60,'new_native_values':40908,
              'logical_attached_native_rows':2145517,'original_sqlite_was_modified':False})
          PY_WID_VERIFY
      - name: Archive attachable WID native SQL layer privately with SHA-256 restore verification
        shell: bash
        run: |
          set -euo pipefail
          local="native_output/$WID_NATIVE_SNAPSHOT_ID.tar.gz"
          remote="onedrive:Diego/economic research database/snapshots/$WID_NATIVE_SNAPSHOT_ID.tar.gz"
          local_hash=$(sha256sum "$local" | cut -d ' ' -f1)
          rclone copyto "$local" "$remote" --retries 3 --low-level-retries 10
          restored_hash=$(rclone cat "$remote" | sha256sum | cut -d ' ' -f1)
          test "$restored_hash" = "$local_hash"
          report_hash=$(python - <<'PY'
          import json,os
          from pathlib import Path
          sid=os.environ['WID_NATIVE_SNAPSHOT_ID']
          print(json.loads((Path('native_output')/(sid+'.integration_report.json')).read_text())['archive_sha256'])
          PY
          )
          test "$local_hash" = "$report_hash"
          rclone copyto "native_output/$WID_NATIVE_SNAPSHOT_ID.integration_report.json" \
            "onedrive:Diego/economic research database/snapshots/$WID_NATIVE_SNAPSHOT_ID.integration_report.json"
          echo "WID_NATIVE_ATTACHABLE_SQLITE_PRIVATE_ROUNDTRIP_VERIFIED $local_hash"
      - name: Publish metadata-only integration receipt, never source observations
        uses: actions/upload-artifact@v4
        with:
          name: atlas-wid-native-shard-receipt-${{ github.run_id }}
          path: native_output/*.integration_report.json
          if-no-files-found: error
          retention-days: 90
      - name: Remove private OneDrive credentials
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/wid-native-rclone/rclone.conf"

  extend-existing-private-source-attachment-with-wdi:
    # Reuse certified source-native SQLite ATTACH layer; never copy the >10GB
    # historical canonical SQLite, re-download WDI or release native data public.
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.operation == 'wdi_attach')
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG_B64 }}
      ONEDRIVE_TARGET: 'onedrive:Diego/economic research database'
    steps:
      - name: Check out Atlas certified native source-extension code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test World Bank original source numeric replay and existing WID SQLite preservation offline
        run: |
          python -m unittest discover -s tests -p 'test_wdi_native_extension.py' -v
          python -m unittest discover -s tests -p 'test_wdi_bulk.py' -v
          python -m unittest discover -s tests -p 'test_wid_native_extension.py' -v
      - name: Prove original WDI and WID source runs completed on main
        shell: bash
        run: |
          set -euo pipefail
          for run in 43637384781 43720165809; do
            test "$(gh api "repos/$GH_REPO/actions/runs/$run" --jq '.conclusion')" = success
            test "$(gh api "repos/$GH_REPO/actions/runs/$run" --jq '.head_branch')" = main
            test "$(gh api "repos/$GH_REPO/actions/runs/$run" --jq '.head_repository.full_name')" = "$GH_REPO"
          done
          test "$(gh api "repos/$GH_REPO/actions/runs/43637384781" --jq '.name')" = 'Refresh World Bank economic data'
          test "$(gh api "repos/$GH_REPO/actions/runs/43720165809" --jq '.name')" = 'Materialize five source-native datasets in canonical warehouse'
      - name: Restore the two certified original-source private archives
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RCLONE_CONFIG_B64"
          sudo apt-get update -qq
          sudo apt-get install -y -qq rclone
          umask 077
          mkdir -p "$RUNNER_TEMP/wdi-native-rclone" "$RUNNER_TEMP/atlas-source-inputs"
          printf '%s' "$RCLONE_CONFIG_B64" | base64 --decode > "$RUNNER_TEMP/wdi-native-rclone/rclone.conf"
          chmod 600 "$RUNNER_TEMP/wdi-native-rclone/rclone.conf"
          # GITHUB_ENV is only loaded by FOLLOWING steps. The rclone downloads
          # below happen in THIS step, so export the variable immediately too.
          export RCLONE_CONFIG="$RUNNER_TEMP/wdi-native-rclone/rclone.conf"
          echo "RCLONE_CONFIG=$RCLONE_CONFIG" >> "$GITHUB_ENV"
          wid="$RUNNER_TEMP/atlas-source-inputs/atlas-wid-native-shard-20261115-43720165809.tar.gz"
          wdi="$RUNNER_TEMP/atlas-source-inputs/wdi-source-43637384781.tar.gz"
          rclone copyto "$ONEDRIVE_TARGET/snapshots/atlas-wid-native-shard-20261115-43720165809.tar.gz" "$wid" --retries 3
          rclone copyto "$ONEDRIVE_TARGET/atlas/wdi-verified-source-archives-v1/run-43637384781/wdi-source-43637384781.tar.gz" "$wdi" --retries 3
          test "$(sha256sum "$wid" | cut -d ' ' -f1)" = faa6f785156d208cd71893fd4d8806a38a9ff68047f2fdacb496271b5fbe2122
          test "$(sha256sum "$wdi" | cut -d ' ' -f1)" = 6f6253a1626bb0bbcf5c9e3e31c49e5f03736e7c15f1e8f73064f8b1666f8f9a
          echo "WDI_NATIVE_WID_PARENT_PRIVATE_SOURCE_ARCHIVES_VERIFIED"
          echo "WID_ARCHIVE=$wid" >> "$GITHUB_ENV"
          echo "WDI_ARCHIVE=$wdi" >> "$GITHUB_ENV"
      - name: Make all 59 original World Bank WDI series queryable beside prior WID source-native observations
        shell: bash
        run: |
          set -euo pipefail
          id="atlas-native-wid-wdi-$(date -u +%Y%m%d)-$GITHUB_RUN_ID"
          echo "ATLAS_NATIVE_WDI_EDITION_ID=$id" >> "$GITHUB_ENV"
          python -m warehouse.wdi_native_extension \
            --wid-archive "$WID_ARCHIVE" \
            --wdi-archive "$WDI_ARCHIVE" \
            --out native_output \
            --snapshot-id "$id"
      - name: Verify original 572179 WDI source values and queryable native Atlas SQLite report
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY_WDI_SQLITE'
          import json,os
          from pathlib import Path
          root=Path('native_output')
          sid=os.environ['ATLAS_NATIVE_WDI_EDITION_ID']
          data=json.loads((root/(sid+'.integration_report.json')).read_text())
          assert data['wdi_source_series_added']==59
          assert data['wdi_source_native_rows_added']==572179
          assert data['prior_wid_source_native_rows_preserved']==40908
          assert data['native_source_records_in_new_attachment']==613087
          assert data['logical_combined_native_rows_including_historical']==2717696
          assert data['geography_codes_including_unclassified_aggregates']==265
          assert data['source_original_wdi_zip_numeric_keys_values_verified'] is True
          assert data['separate_canonical_observations_unchanged']==2780117
          assert data['old_canonical_sqlite_modified'] is False
          assert data['public_release'] is False and data['causal_ready'] is False
          assert data['storage_mode']=='ATLAS_ATTACHABLE_VERSIONED_SOURCE_NATIVE_EXTENSION'
          assert (root/(sid+'.tar.gz')).is_file()
          print('WDI_59_SOURCE_SERIES_572179_NATIVE_ROWS_INDEXED_AND_WID_PRESERVED',{
              'world_bank_numeric_values':572179,
              'old_WID_source_native_values':40908,
              'queryable_private_attachment_rows':613087,
              'old_canonical_rows_modified':False,
              'public_published':False})
          PY_WDI_SQLITE
      - name: Store entire newly queryable private source-native SQLite edition in OneDrive and SHA-verify restored bytes
        shell: bash
        run: |
          set -euo pipefail
          archive="native_output/$ATLAS_NATIVE_WDI_EDITION_ID.tar.gz"
          remote="$ONEDRIVE_TARGET/snapshots/$ATLAS_NATIVE_WDI_EDITION_ID.tar.gz"
          original_sha=$(sha256sum "$archive" | cut -d ' ' -f1)
          rclone copyto "$archive" "$remote" --retries 3 --low-level-retries 10
          restored_sha=$(rclone cat "$remote" | sha256sum | cut -d ' ' -f1)
          test "$original_sha" = "$restored_sha"
          recorded_sha=$(python - <<'PY'
          import json,os
          from pathlib import Path
          sid=os.environ['ATLAS_NATIVE_WDI_EDITION_ID']
          print(json.loads((Path('native_output')/(sid+'.integration_report.json')).read_text())['archive_sha256'])
          PY
          )
          test "$original_sha" = "$recorded_sha"
          rclone copyto "native_output/$ATLAS_NATIVE_WDI_EDITION_ID.integration_report.json" \
            "$ONEDRIVE_TARGET/snapshots/$ATLAS_NATIVE_WDI_EDITION_ID.integration_report.json" --retries 3
          echo "ATLAS_WDI_WID_NATIVE_SQLITE_PRIVATE_ROUNDTRIP_VERIFIED $original_sha"
      - name: Publish metadata-only numerical integration receipt, never provider data or private SQLite
        uses: actions/upload-artifact@v4
        with:
          name: atlas-wdi-59-native-receipt-${{ github.run_id }}
          path: native_output/*.integration_report.json
          retention-days: 90
          if-no-files-found: error
      - name: Remove private OneDrive OAuth configuration
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/wdi-native-rclone/rclone.conf"
