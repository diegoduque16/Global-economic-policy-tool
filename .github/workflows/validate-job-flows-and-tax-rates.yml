name: Validate BLS job flows and OECD corporate tax rates
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bls-bed:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retrieve and audit BLS annual job gains and losses
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, datetime, hashlib, io, json, math, pathlib, urllib.request
          output=pathlib.Path('research/bls_bed');output.mkdir(parents=True,exist_ok=True)
          url='https://www.bls.gov/web/cewbd/bd_data_ann.txt'
          report={'source':'BLS annual Business Employment Dynamics','source_url':url,'status':'NOT_VALIDATED','research_ready':False,
                  'notes':['Annual March-to-March gross flows differ from the sum of quarterly gross flows',
                           'Values are thousands of jobs; establishments and rates are excluded',
                           'National and state values overlap; never sum across both',
                           'Annual quarter reference is retained to prevent accidental mixing']}
          try:
              req=urllib.request.Request(url,headers={'User-Agent':'EconomicPolicyResearch/1.0 (source audit)','Accept':'text/plain,*/*'})
              with urllib.request.urlopen(req,timeout=100) as response:
                  raw=response.read(80_000_001)
              if len(raw)>80_000_000: raise ValueError('BLS annual file exceeds 80MB; refusing unbounded download')
              if raw.lstrip().lower().startswith((b'<html',b'<!doctype')): raise ValueError('BLS returned HTML instead of the annual data file')
              report['source_sha256']=hashlib.sha256(raw).hexdigest();report['download_bytes']=len(raw)
              reader=csv.reader(io.StringIO(raw.decode('utf-8-sig')),delimiter='\t')
              rows=[];dup=set();skipped=0
              for fields in reader:
                  if len(fields)<4:continue
                  sid=fields[0].strip();year_text=fields[1].strip();quarter=fields[2].strip()
                  if len(sid)<28 or not year_text.isdecimal():continue
                  # Official BLS BED positions: seasonal, geography, industry, unit,
                  # data-element, establishment-size, data-class, level, annual, ownership.
                  if not (sid[:2]=='BD' and sid[2]=='U' and sid[3:8]=='00000' and
                      sid[10:13]=='000' and sid[13:19]=='000000' and sid[19:21]=='11' and
                      sid[21:23]=='00' and sid[23:25] in ('01','04') and
                      sid[25:28]=='LA5' and quarter=='Q01'):continue
                  year=int(year_text)
                  if not 1992<=year<=2026:continue
                  value_text=fields[3].strip().replace(',','')
                  try:value=float(value_text)
                  except ValueError:skipped+=1;continue
                  if not math.isfinite(value) or value<0:raise ValueError('Invalid BLS job-flow value')
                  state=sid[8:10];kind='gross_job_gains' if sid[23:25]=='01' else 'gross_job_losses'
                  key=(state,year,quarter,kind)
                  if key in dup:raise ValueError('Duplicate BED observations: '+str(key))
                  dup.add(key)
                  rows.append({'provider':'US BLS','dataset':'Business Employment Dynamics annual',
                     'geography_level':'national' if state=='00' else 'state','state_fips':state,
                     'year':year,'reference_quarter':quarter,'series':kind,
                     'value':value,'unit':'thousands_of_jobs','series_id':sid,'source_url':url})
              rows.sort(key=lambda r:(r['state_fips'],r['series'],r['year']))
              if len(rows)<200 or len({r['year'] for r in rows})<10 or not {'gross_job_gains','gross_job_losses'}<=set(r['series'] for r in rows):
                  raise ValueError('Coverage insufficient or source structure changed: '+str(len(rows)))
              if not any(r['state_fips']=='00' for r in rows):raise ValueError('National series missing')
              panel=output/'job_flows.csv'
              with panel.open('w',newline='',encoding='utf-8') as f:
                  writer=csv.DictWriter(f,fieldnames=list(rows[0]));writer.writeheader();writer.writerows(rows)
              report.update({'status':'VALIDATED_EXTRACT','observations':len(rows),
                   'geographies':len({r['state_fips'] for r in rows}),
                   'earliest_year':min(r['year'] for r in rows),'latest_year':max(r['year'] for r in rows),
                   'non_numeric_rows_skipped':skipped,'panel_sha256':hashlib.sha256(panel.read_bytes()).hexdigest()})
          except Exception as exc:
              report['error']=f'{type(exc).__name__}: {str(exc)[:350]}'
          (output/'report.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report,indent=2))
          if report['status']!='VALIDATED_EXTRACT':raise SystemExit('BLS BED validation failed; see diagnostic artifact')
          PY
      - name: Save BLS evidence or diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bls-bed-evidence-${{ github.run_number }}
          path: research/bls_bed/*
          retention-days: 90
          if-no-files-found: warn

  oecd-cit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retrieve and audit OECD statutory corporate tax rates
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, datetime, hashlib, io, json, math, pathlib, urllib.error, urllib.request, time
          output=pathlib.Path('research/oecd_cit');output.mkdir(parents=True,exist_ok=True)
          url=('https://sdmx.oecd.org/public/rest/data/'
               'OECD.CTP.TPS,DSD_TAX_CIT@DF_CIT,2.0/.A..ST..S13...?'
               'startPeriod=1990&endPeriod=2026&dimensionAtObservation=AllDimensions&format=csvfile')
          report={'source':'OECD Corporate Tax Statistics','dataset':'DSD_TAX_CIT@DF_CIT version 2.0',
                  'source_url':url,'status':'NOT_VALIDATED','research_ready':False,
                  'notes':['Statutory tax rates are distinct from effective tax rates and tax revenues',
                           'Legal tax rates do not independently identify causal policy shocks',
                           'Preserve targeting, jurisdiction, sector and original unit codes']}
          try:
              for attempt in range(3):
                  try:
                      req=urllib.request.Request(url,headers={'User-Agent':'EconomicPolicyResearch/1.0 (source audit)',
                             'Accept':'text/csv,application/vnd.sdmx.csv,*/*'})
                      with urllib.request.urlopen(req,timeout=95) as response: raw=response.read(15_000_001)
                      break
                  except urllib.error.HTTPError as e:
                      if e.code not in (429,500,502,503,504) or attempt==2:raise
                      time.sleep(3*(attempt+1))
              if len(raw)>15_000_000:raise ValueError('OECD response exceeds 15MB')
              if raw.lstrip().lower().startswith((b'<html',b'<!doctype',b'<?xml')):raise ValueError('Expected SDMX CSV, received markup')
              report['source_sha256']=hashlib.sha256(raw).hexdigest();report['download_bytes']=len(raw)
              reader=csv.DictReader(io.StringIO(raw.decode('utf-8-sig')))
              columns=reader.fieldnames or []
              if not {'REF_AREA','TIME_PERIOD','OBS_VALUE'}.issubset(columns):
                  raise ValueError('OECD CSV missing essential columns: '+repr(columns[:20]))
              report['columns']=columns
              # Never assert the meaning of an unknown SDMX dimension.
              target_col=next((c for c in ('TARGETING','TAX_TARGETING') if c in columns),None)
              sector_col=next((c for c in ('INSTITUTIONAL_SECTOR','SECTOR') if c in columns),None)
              if not target_col or not sector_col:raise ValueError('Unable to confirm statutory-rate and government-sector dimensions')
              rows=[];keys=set()
              for entry in reader:
                  if entry.get(target_col)!='ST' or entry.get(sector_col)!='S13':continue
                  try:year=int(entry.get('TIME_PERIOD',''));value=float(entry.get('OBS_VALUE',''))
                  except (TypeError,ValueError):continue
                  if not (1990<=year<=2026 and math.isfinite(value) and 0<=value<=100):continue
                  geo=(entry.get('REF_AREA') or '').strip()
                  if not geo:continue
                  dimensions={k:(v or '') for k,v in entry.items() if k not in ('OBS_VALUE','TIME_PERIOD','REF_AREA')}
                  series='DSD_TAX_CIT@DF_CIT:'+':'.join((dimensions.get(k,'') for k in columns if k not in ('REF_AREA','TIME_PERIOD','OBS_VALUE','DATAFLOW','OBS_STATUS','DECIMALS','UNIT_MULT')))
                  unique=(geo,year,series)
                  if unique in keys:raise ValueError('Duplicate OECD corporate tax observation '+str(unique))
                  keys.add(unique)
                  rows.append({'provider':'OECD','dataset':'Corporate income tax statutory rates',
                      'geo':geo,'year':year,'series':series,'value':value,
                      'source_unit':entry.get('UNIT_MEASURE') or entry.get('UNIT') or 'source_defined',
                      'obs_status':entry.get('OBS_STATUS') or '',
                      'dimensions_json':json.dumps(dimensions,sort_keys=True),'source_url':url})
              rows.sort(key=lambda r:(r['geo'],r['year'],r['series']))
              if len(rows)<100 or len({r['geo'] for r in rows})<10:
                  raise ValueError('Insufficient country-rate observations; schema or query needs revision: '+str(len(rows)))
              panel=output/'corporate_tax_rates.csv'
              with panel.open('w',newline='',encoding='utf-8') as f:
                  writer=csv.DictWriter(f,fieldnames=list(rows[0]));writer.writeheader();writer.writerows(rows)
              report.update({'status':'VALIDATED_EXTRACT','observations':len(rows),
                  'countries_or_areas':len({r['geo'] for r in rows}),
                  'earliest_year':min(r['year'] for r in rows),'latest_year':max(r['year'] for r in rows),
                  'panel_sha256':hashlib.sha256(panel.read_bytes()).hexdigest()})
          except Exception as exc:
              report['error']=f'{type(exc).__name__}: {str(exc)[:350]}'
          (output/'report.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report,indent=2))
          if report['status']!='VALIDATED_EXTRACT':raise SystemExit('OECD CIT validation failed; see diagnostic artifact')
          PY
      - name: Save OECD evidence or diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oecd-cit-evidence-${{ github.run_number }}
          path: research/oecd_cit/*
          retention-days: 90
          if-no-files-found: warn
