name: Refresh IMF and OECD public data
'on':
  workflow_dispatch:
    inputs:
      scope:
        description: Small smoke test or all configured indicators
        type: choice
        required: true
        default: smoke
        options:
          - smoke
          - full
      source:
        description: Which public sources to download
        type: choice
        required: true
        default: both
        options:
          - both
          - imf
          - oecd
permissions:
  contents: read
jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Get source code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run offline unit tests
        run: python -m unittest discover -s tests -p 'test_imf_oecd.py' -v
      - name: Download selected public sources
        run: python open_data/imf_oecd.py --scope '${{ inputs.scope }}' --source '${{ inputs.source }}' --out data/imf_oecd
      - name: Save data and error reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: imf-oecd-${{ github.run_number }}
          path: data/imf_oecd/
          if-no-files-found: warn
          retention-days: 90
