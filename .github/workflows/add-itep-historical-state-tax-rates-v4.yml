    - name: Back up expanded archive to existing private OneDrive and verify checksum
      env:
        RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG_B64 }}
      shell: bash
      run: |
        set -euo pipefail
        test -n "$RCLONE_CONFIG_B64" || { echo 'Missing RCLONE_CONFIG_B64 secret' >&2; exit 1; }
        sudo apt-get update -qq
        sudo apt-get install -y -qq rclone
        umask 077
        mkdir -p "$RUNNER_TEMP/rclone"
        printf '%s' "$RCLONE_CONFIG_B64" | base64 --decode > "$RUNNER_TEMP/rclone/rclone.conf"
        chmod 600 "$RUNNER_TEMP/rclone/rclone.conf"
        export RCLONE_CONFIG="$RUNNER_TEMP/rclone/rclone.conf"
        archive="warehouse_output/${SNAPSHOT_ID}.tar.gz"
        remote="$ONEDRIVE_TARGET/snapshots/$(basename "$archive")"
        rclone copyto "$archive" "$remote" --retries 3 --low-level-retries 10
        local_hash=$(sha256sum "$archive" | awk '{print $1}')
        remote_hash=$(rclone hashsum SHA-256 "$remote" 2>/dev/null | awk 'NR==1 {print $1}' || true)
        if [[ "$remote_hash" =~ ^[0-9a-fA-F]{64}$ ]]; then
          test "${local_hash,,}" = "${remote_hash,,}" || { echo 'OneDrive SHA256 mismatch' >&2; exit 1; }
        else
          rclone copyto "$remote" "$RUNNER_TEMP/verified-itep-snapshot.tar.gz"
          cmp "$archive" "$RUNNER_TEMP/verified-itep-snapshot.tar.gz"
        fi
        printf '%s  %s\n' "$local_hash" "$(basename "$archive")" > "$RUNNER_TEMP/$SNAPSHOT_ID.sha256"
        rclone copyto "$RUNNER_TEMP/$SNAPSHOT_ID.sha256" "$remote.sha256"
        rclone copyto "warehouse_output/$SNAPSHOT_ID/manifest.json" "$ONEDRIVE_TARGET/snapshots/$SNAPSHOT_ID.manifest.json"
        rclone copyto itep_addition_report.json "$ONEDRIVE_TARGET/snapshots/$SNAPSHOT_ID.itep_addition_report.json"
        echo "OneDrive verified: $remote SHA256=$local_hash"
    - name: Erase temporary OneDrive OAuth credentials
      if: always()
      run: rm -f "$RUNNER_TEMP/rclone/rclone.conf"
