    - name: Validate prior warehouse and download complete verified artifact
      shell: bash
      run: |
        set -euo pipefail
        [[ "$BASELINE_RUN_ID" =~ ^[0-9]+$ ]] || exit 1
        name=$(gh api "repos/$GH_REPO/actions/runs/$BASELINE_RUN_ID" --jq .name)
        conclusion=$(gh api "repos/$GH_REPO/actions/runs/$BASELINE_RUN_ID" --jq .conclusion)
        branch=$(gh api "repos/$GH_REPO/actions/runs/$BASELINE_RUN_ID" --jq .head_branch)
        test "$name" = 'Add state tax policy locations and effective dates to full warehouse'
        test "$conclusion" = success
        test "$branch" = main
        mkdir -p downloads/baseline
        gh run download "$BASELINE_RUN_ID" --repo "$GH_REPO" --pattern 'economic-with-tax-effective-dates-*' --dir downloads/baseline
    - name: Restore all previous source families and verify SHA256
      run: |-
        python - <<'PY'
        from pathlib import Path
        from warehouse.consolidate import SnapshotArchive,exactly_one_archive
        import json
        snap=SnapshotArchive(exactly_one_archive(Path('downloads/baseline')))
        try:
            families=snap.families
            assert len(families)>=23, len(families)
            assert {'state_tax_policy_actions','census_bds','us_state_tax','oecd_cit'}.issubset(families)
            expected=snap.manifest['total_source_observations']
            assert expected>=2759984,expected
            Path('baseline_manifest.json').write_text(json.dumps(snap.manifest,indent=2)+'\n')
            registry={**__import__('warehouse.snapshot',fromlist=['FAMILIES']).FAMILIES,
                      **__import__('warehouse.snapshot',fromlist=['OPTIONAL_FAMILIES']).OPTIONAL_FAMILIES}
            for fam in families:
                folder,filename,_=registry[fam]
                root=Path('merged_data')/folder
                snap.copy_verified(f'sources/{fam}/processed/{filename}',root/'processed'/filename)
                snap.copy_verified(f'sources/{fam}/run_report.json',root/'run_report.json')
            print('Restored validated baseline source families:',len(families),'observations:',expected)
        finally:snap.close()
        PY
    - name: Register separate ITEP rate family without altering other datasets
      run: |-
        python - <<'PY'
        from pathlib import Path
        path=Path('warehouse/snapshot.py')
        s=path.read_text(encoding='utf-8')
        assert 'OPTIONAL_FAMILIES = {\n' in s
        entry="    'itep_tax_rates': ('itep_tax_rates', 'itep_tax_rates_panel.csv', 1500),\n"
        if "'itep_tax_rates':" not in s:
            s=s.replace('OPTIONAL_FAMILIES = {\n','OPTIONAL_FAMILIES = {\n'+entry,1)
            path.write_text(s,encoding='utf-8')
        from warehouse.snapshot import OPTIONAL_FAMILIES
        assert OPTIONAL_FAMILIES['itep_tax_rates']==('itep_tax_rates','itep_tax_rates_panel.csv',1500)
        PY
    - name: Build expanded source-separated SQLite research warehouse
      shell: bash
      run: |-
        set -euo pipefail
        ID="economic-with-itep-rates-$(date -u +%Y%m%d)-${GITHUB_RUN_ID}"
        echo "SNAPSHOT_ID=$ID" >> "$GITHUB_ENV"
        python warehouse/snapshot.py --data merged_data --out warehouse_output --snapshot-id "$ID"
    - name: Verify every original family retained and validate exact new rate increment
      run: |-
        python - <<'PY'
        from pathlib import Path
        import csv,json,sqlite3,os,hashlib
        old=json.loads(Path('baseline_manifest.json').read_text(encoding='utf-8'))
        new=json.loads((Path('warehouse_output')/os.environ['SNAPSHOT_ID']/'manifest.json').read_text(encoding='utf-8'))
        original=old['source_families'];combined=new['source_families']
        assert len(original)>=23
        assert set(combined)==set(original)|{'itep_tax_rates'},(sorted(set(original)-set(combined)),sorted(set(combined)-set(original)))
        for family,earlier in original.items():
            assert combined[family]['rows']==earlier['rows'],(family,earlier,combined[family])
        source=json.loads(Path('merged_data/itep_tax_rates/run_report.json').read_text())
        assert source['observations']>=1500
        assert combined['itep_tax_rates']['rows']==source['observations']
        assert new['total_source_observations']==old['total_source_observations']+source['observations']
        db=Path('warehouse_output')/os.environ['SNAPSHOT_ID']/'warehouse.sqlite'
        with sqlite3.connect(db) as conn:
            assert conn.execute('SELECT COUNT(*) FROM observations').fetchone()[0]==new['total_source_observations']
            assert conn.execute('PRAGMA integrity_check').fetchone()[0]=='ok'
            assert conn.execute("SELECT COUNT(*) FROM observations WHERE family='itep_tax_rates'").fetchone()[0]==source['observations']
        report={'snapshot_id':new['snapshot_id'],'baseline_run_id':os.environ['BASELINE_RUN_ID'],
                'previous_observations':old['total_source_observations'],'itep_observations':source['observations'],
                'total_observations':new['total_source_observations'],
                'source_families':len(combined),'itep_source_sha256':source['source_sha256'],
                'baseline_families_preserved_exactly':True,
                'is_causal_inference_ready':False}
        Path('itep_addition_report.json').write_text(json.dumps(report,indent=2)+'\n')
        print(json.dumps(report,indent=2))
        PY
