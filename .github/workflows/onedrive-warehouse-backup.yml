name: Back up economic warehouse to OneDrive

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'Successful original or canonical economic warehouse Actions run ID'
        required: true
        type: string
        default: '40616230528'
  workflow_run:
    workflows:
      - 'Build versioned economic research warehouse'
      - 'Build canonical economic warehouse inventory'
    types: [completed]

permissions:
  actions: read
  contents: read

concurrency:
  group: onedrive-warehouse-backup-${{ github.event.workflow_run.id || inputs.source_run_id }}
  cancel-in-progress: false

jobs:
  backup:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG_B64 }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TARGET: 'onedrive:Diego/economic research database'
      RUN_ID: ${{ github.event.workflow_run.id || inputs.source_run_id }}
    steps:
      - name: Validate credentials and source warehouse
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RCLONE_CONFIG_B64" || { echo 'Missing RCLONE_CONFIG_B64 repository secret' >&2; exit 1; }
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || { echo 'Invalid source run ID' >&2; exit 1; }
          conclusion=$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID" --jq '.conclusion')
          name=$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID" --jq '.name')
          branch=$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID" --jq '.head_branch')
          source_repo=$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID" --jq '.head_repository.full_name')
          test "$conclusion" = success || { echo "Source run conclusion: $conclusion" >&2; exit 1; }
          test "$branch" = main || { echo "Unexpected source branch: $branch" >&2; exit 1; }
          test "$source_repo" = "$GH_REPO" || { echo "Unexpected source repository: $source_repo" >&2; exit 1; }
          case "$name" in
            'Build versioned economic research warehouse')
              echo "ARCHIVE_PATTERN=economic-*.tar.gz" >> "$GITHUB_ENV"
              echo "ARTIFACT_NAME=" >> "$GITHUB_ENV"
              echo "BACKUP_KIND=legacy" >> "$GITHUB_ENV"
              ;;
            'Build canonical economic warehouse inventory')
              echo "ARCHIVE_PATTERN=canonical-*.tar.gz" >> "$GITHUB_ENV"
              echo "ARTIFACT_NAME=canonical-warehouse-$RUN_ID" >> "$GITHUB_ENV"
              echo "BACKUP_KIND=canonical" >> "$GITHUB_ENV"
              ;;
            *) echo "Unexpected source workflow: $name" >&2; exit 1 ;;
          esac
      - name: Download exact source artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/warehouse"
          if [ -n "$ARTIFACT_NAME" ]; then
            gh run download "$RUN_ID" --repo "$GH_REPO" --name "$ARTIFACT_NAME" --dir "$RUNNER_TEMP/warehouse"
          else
            gh run download "$RUN_ID" --repo "$GH_REPO" --dir "$RUNNER_TEMP/warehouse"
          fi
          mapfile -d '' -t archives < <(find "$RUNNER_TEMP/warehouse" -type f -name "$ARCHIVE_PATTERN" -print0)
          test "${#archives[@]}" -eq 1 || { echo "Expected exactly one $ARCHIVE_PATTERN archive; found ${#archives[@]}" >&2; exit 1; }
          echo "ARCHIVE_PATH=${archives[0]}" >> "$GITHUB_ENV"
          if [ "$BACKUP_KIND" = canonical ]; then
            mapfile -d '' -t inventories < <(find "$RUNNER_TEMP/warehouse" -type f -name 'unified_inventory.json' -print0)
            test "${#inventories[@]}" -eq 1 || { echo "Expected exactly one canonical inventory" >&2; exit 1; }
            echo "INVENTORY_PATH=${inventories[0]}" >> "$GITHUB_ENV"
          fi
      - name: Install rclone and load existing private OneDrive credentials
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq rclone
          umask 077
          mkdir -p "$RUNNER_TEMP/rclone"
          printf '%s' "$RCLONE_CONFIG_B64" | base64 --decode > "$RUNNER_TEMP/rclone/rclone.conf"
          chmod 600 "$RUNNER_TEMP/rclone/rclone.conf"
          echo "RCLONE_CONFIG=$RUNNER_TEMP/rclone/rclone.conf" >> "$GITHUB_ENV"
      - name: Upload to OneDrive and verify the archived bytes
        shell: bash
        run: |
          set -euo pipefail
          file=$(basename "$ARCHIVE_PATH")
          remote="$TARGET/snapshots/$file"
          rclone copyto "$ARCHIVE_PATH" "$remote" --retries 3 --low-level-retries 10
          local_hash=$(sha256sum "$ARCHIVE_PATH" | awk '{print $1}')
          remote_hash=$(rclone hashsum SHA-256 "$remote" 2>/dev/null | awk 'NR==1 {print $1}' || true)
          if [[ "$remote_hash" =~ ^[0-9a-fA-F]{64}$ ]]; then
            test "${local_hash,,}" = "${remote_hash,,}" || { echo 'SHA-256 mismatch' >&2; exit 1; }
          else
            echo 'Remote SHA-256 unavailable; verifying by downloading the full archive.'
            rclone copyto "$remote" "$RUNNER_TEMP/verify-backup.tar.gz" --retries 3
            cmp "$ARCHIVE_PATH" "$RUNNER_TEMP/verify-backup.tar.gz"
          fi
          printf '%s  %s\n' "$local_hash" "$file" > "$RUNNER_TEMP/$file.sha256"
          rclone copyto "$RUNNER_TEMP/$file.sha256" "$remote.sha256"
          if [ "$BACKUP_KIND" = canonical ]; then
            snapshot_id="${file%.tar.gz}"
            rclone copyto "$INVENTORY_PATH" "$TARGET/snapshots/${snapshot_id}.unified_inventory.json"
          fi
          echo "OneDrive backup verified at $remote (SHA-256: $local_hash)"
      - name: Remove temporary OAuth credentials
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/rclone/rclone.conf"
