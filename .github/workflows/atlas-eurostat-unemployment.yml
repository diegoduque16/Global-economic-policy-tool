name: Publish verified Eurostat annual unemployment for Atlas charts

on:
  pull_request:
    paths:
      - 'atlas_public/eurostat_unemployment.py'
      - 'atlas_public/build_eurostat_charts.py'
      - 'atlas_public/build_site.py'
      - 'atlas_public/public_adapter.js'
      - 'atlas_web/static/app.js'
      - 'tests/test_eurostat_public.py'
      - '.github/workflows/atlas-eurostat-unemployment.yml'
  push:
    branches: [main]
    paths:
      - 'atlas_public/eurostat_unemployment.py'
      - 'atlas_public/build_eurostat_charts.py'
      - '.github/workflows/atlas-eurostat-unemployment.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atlas-eurostat-unemployment-source-public
  cancel-in-progress: false

jobs:
  offline-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate original Eurostat source dimensions and source-native charts
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_eurostat_public.py' -v
          python -m unittest discover -s tests -p 'test_atlas_public.py' -v
          python -m py_compile atlas_public/eurostat_unemployment.py atlas_public/build_eurostat_charts.py

  publish-eurostat:
    if: github.event_name != 'pull_request'
    needs: offline-validate
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch official published Eurostat JSON-stat source and validate chart release
        run: |
          set -euo pipefail
          python -m atlas_public.eurostat_unemployment \
            --output atlas_public/data/eurostat/annual_unemployment.json
          python - <<'PY_VERIFY'
          import json
          from pathlib import Path
          from atlas_public.build_site import build
          root=Path("atlas_public/data/eurostat")
          source=json.loads((root/"annual_unemployment.json").read_text())
          assert source["numeric_observations"]>=200
          assert source["series_breakdowns"]==6
          assert source["original_unit"]=="PC_ACT"
          assert len(source["geography_labels"])>=15
          receipt=build(include_research=False)
          site=Path(receipt["output"])
          chart=json.loads((site/"data"/"eurostat"/"charts"/"catalog.json").read_text())
          assert chart["numeric_observations"]==source["numeric_observations"]
          assert chart["series_breakdowns"]==6
          assert chart["chartable_geographies"]>=15
          assert sum(x["numeric_records"] for x in chart["geographies"])==source["numeric_observations"]
          assert '<option value="eurostat">' in (site/"index.html").read_text()
          print("ATLAS_PUBLIC_EUROSTAT_CHART_RELEASE_VERIFIED",chart["numeric_observations"],
                chart["chartable_geographies"],source["source_raw_sha256"])
          PY_VERIFY
          node --check atlas_public/dist/app.js
          node --check atlas_public/dist/public_adapter.js
      - name: Commit only official Eurostat public source values and provenance
        run: |
          set -euo pipefail
          git config user.name "Atlas Verified Public Data Publisher"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add atlas_public/data/eurostat/annual_unemployment.json
          if git diff --cached --quiet; then
            echo "Verified public Eurostat source snapshot unchanged."
            exit 0
          fi
          git commit -m "Publish validated Eurostat annual unemployment original official data [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
