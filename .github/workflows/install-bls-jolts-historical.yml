name: Collect BLS JOLTS original labor-flow data in private Atlas source archive

on:
  pull_request:
    paths:
      - 'open_data/bls_jolts.py'
      - 'tests/test_bls_jolts_source.py'
      - '.github/workflows/install-bls-jolts-historical.yml'
      - 'docs/atlas_project_brief.json'
  push:
    branches: [main]
    paths:
      - 'open_data/bls_jolts.py'
      - 'tests/test_bls_jolts_source.py'
      - '.github/workflows/install-bls-jolts-historical.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-bls-jolts-original-source
  cancel-in-progress: false

jobs:
  offline-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate original-BLS-source replay, duplicate rows and tampering guards
        run: |
          python -m unittest discover -s tests -p 'test_bls_jolts_source.py' -v
          python -m py_compile open_data/bls_jolts.py
      - name: Validate permanent project brief
        run: python -m json.tool docs/atlas_project_brief.json > /dev/null

  collect-and-archive:
    # Original provider downloads and OneDrive secrets never run on PRs.
    needs: offline-validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ONEDRIVE_TARGET: 'onedrive:Diego/economic research database'
      RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG_B64 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Acquire original monthly national, state and industry JOLTS measurements
        run: |
          python open_data/bls_jolts.py --out data/bls_jolts --start 2000 --end 2026
      - name: Reconstruct every source-native numeric observation from original BLS bytes
        run: |
          python open_data/bls_jolts.py --out data/bls_jolts --verify-only
          python - <<'PY_CHECK'
          import json
          from pathlib import Path
          root=Path('data/bls_jolts')
          report=json.loads((root/'run_report.json').read_text())
          assert report['errors']==[] and report['conflicts']==[]
          assert report['observations']>=5000
          assert report['series_ids']>=40
          assert set(report['manifest'][i]['name'] for i in range(2))=={'jt.series','jt.data.1.AllItems'}
          assert (root/'raw'/'jt.series').is_file()
          assert (root/'raw'/'jt.data.1.AllItems').is_file()
          assert report['research_ready'] is False
          print('BLS_JOLTS_ORIGINAL_NUMERIC_REPLAY_COMPLETE', report['observations'])
          PY_CHECK
      - name: Archive original source + processed values privately with exact SHA256 restore
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RCLONE_CONFIG_B64"
          sudo apt-get update -qq
          sudo apt-get install -y -qq rclone
          umask 077
          mkdir -p "$RUNNER_TEMP/atlas-jolts-rclone"
          printf '%s' "$RCLONE_CONFIG_B64" | base64 --decode > "$RUNNER_TEMP/atlas-jolts-rclone/rclone.conf"
          chmod 600 "$RUNNER_TEMP/atlas-jolts-rclone/rclone.conf"
          export RCLONE_CONFIG="$RUNNER_TEMP/atlas-jolts-rclone/rclone.conf"
          archive="$RUNNER_TEMP/atlas-jolts-original-$GITHUB_RUN_ID.tar.gz"
          tar -czf "$archive" -C data bls_jolts
          expected=$(sha256sum "$archive" | cut -d ' ' -f1)
          remote="$ONEDRIVE_TARGET/atlas/bls-jolts-source-v1/run-$GITHUB_RUN_ID-attempt-$GITHUB_RUN_ATTEMPT"
          rclone copyto "$archive" "$remote/bls-jolts-original-source.tar.gz" --retries 3
          actual=$(rclone cat "$remote/bls-jolts-original-source.tar.gz" | sha256sum | cut -d ' ' -f1)
          test "$actual" = "$expected"
          echo "BLS_JOLTS_ORIGINAL_PRIVATE_ARCHIVE_SHA_VERIFIED $expected"
          rm -f "$RUNNER_TEMP/atlas-jolts-rclone/rclone.conf"
      - name: Publish metadata-only source summary, not source bytes
        uses: actions/upload-artifact@v4
        with:
          name: atlas-bls-jolts-original-source-receipt-${{ github.run_id }}
          path: data/bls_jolts/run_report.json
          retention-days: 90
          if-no-files-found: error
      - name: Remove transient private credentials
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/atlas-jolts-rclone/rclone.conf"
