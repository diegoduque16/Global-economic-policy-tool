name: Atlas 3 - Discover IMF OECD BIS SDMX dataflow catalogs

on:
  workflow_dispatch:
    inputs:
      provider:
        description: 'Pilot one official SDMX provider at a time'
        required: true
        default: imf
        type: choice
        options:
          - imf
          - oecd
          - bis

permissions:
  contents: read

concurrency:
  group: atlas3-dataflow-discovery-${{ inputs.provider }}
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test provider-neutral SDMX parser and source integrity
        run: python -m unittest discover -s tests -p 'test_atlas3_discovery.py' -v
      - name: Discover public SDMX dataflows without downloading economic observations
        env:
          PROVIDER: ${{ inputs.provider }}
        shell: bash
        run: |
          set -euo pipefail
          python research/atlas3_discover_sdmx_dataflows.py --provider "$PROVIDER" --out atlas3_sdmx_output
      - name: Verify catalog and SHA256 integrity
        shell: bash
        env:
          PROVIDER: ${{ inputs.provider }}
        run: |
          python - <<'PY'
          import csv, hashlib, json, os
          from pathlib import Path
          p = Path('atlas3_sdmx_output')
          report = json.loads((p/'atlas3_sdmx_summary.json').read_text())
          assert report['provider'] == os.environ['PROVIDER']
          assert report['economic_observations_downloaded'] == 0
          assert report['time_series_discovered'] is None
          assert not report['research_ready']
          assert not report['redistribution_license_verified']
          with (p/'discovered_sdmx_dataflows.csv').open(encoding='utf-8',newline='') as f:
              rows = list(csv.DictReader(f))
          assert len(rows) == report['distinct_dataflow_entries'] > 0
          assert len({x['dataflow_key'] for x in rows}) == len(rows)
          assert all(x['provider'] == report['provider'] for x in rows)
          checks = json.loads((p/'sha256_manifest.json').read_text())
          assert set(checks) == {'atlas3_sdmx_summary.json','discovered_sdmx_dataflows.csv'}
          for filename, item in checks.items():
              data = (p/filename).read_bytes()
              assert len(data) == item['bytes']
              assert hashlib.sha256(data).hexdigest() == item['sha256']
          print('PASS: validated', len(rows), 'SDMX dataflows, 0 numeric observations')
          PY
      - name: Archive public metadata-only report
        uses: actions/upload-artifact@v4
        with:
          name: atlas3-${{ inputs.provider }}-sdmx-dataflows-${{ github.run_id }}
          path: atlas3_sdmx_output/*
          if-no-files-found: error
          retention-days: 90
