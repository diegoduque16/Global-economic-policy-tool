                "source_run": "41010751593"
              }
            ]
          }
          JSON_23_PINNED_SOURCES
      - name: Install synthetic numeric validation regressions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tests
          cat > tests/test_wid_numeric_panel.py <<'PY_REAL_NUMERIC_TESTS'
          """Synthetic data only. These are regression tests, NOT real WID observations."""
          from __future__ import annotations
          import csv
          import json
          import sqlite3
          import sys
          import tempfile
          import unittest
          from pathlib import Path
          
          sys.path.insert(0,str(Path(__file__).resolve().parents[1]))
          from research.build_wid_numeric_panel import build, parse_variable, verified_manifest
          
          class NumericValueTests(unittest.TestCase):
              def seed(self, root, bad=None):
                  root=Path(root)
                  (root/'input'/'US').mkdir(parents=True)
                  original='a'*64
                  rows=[
                      dict(wid_area='US',year='2024',percentile='p0p50',concept='pretax_national_income_share',
                           source_variable='sptincj992',share_fraction='0.15',source_file_sha256=original,
                           research_status='source_native_descriptive_not_causal',quality_grade='3'),
                      dict(wid_area='US',year='2024',percentile='p0p50',concept='posttax_national_income_share',
                           source_variable='sdiinc992j',share_fraction='0.23',source_file_sha256=original,
                           research_status='source_native_descriptive_not_causal',quality_grade='3'),
                      dict(wid_area='US',year='2024',percentile='p99p100',concept='personal_wealth_share',
                           source_variable='shwealj992',share_fraction='0.35',source_file_sha256=original,
                           research_status='source_native_descriptive_not_causal',quality_grade='2'),
                  ]
                  if bad=='text':rows[0]['share_fraction']='not a number'
                  if bad=='duplicate':rows[1]=rows[0].copy()
                  if bad=='bad_sha':rows[0]['source_file_sha256']='b'*64
                  p=root/'input'/'US'/'wid_source_native_shares.csv'
                  with p.open('w',newline='') as f:
                      w=csv.DictWriter(f,fieldnames=list(rows[0]));w.writeheader();w.writerows(rows)
                  manifest={'schema_version':'1.0','source_remote_prefix':'onedrive:Somewhere',
                            'expected_country_count':1,'expected_numeric_values':3,
                            'expected_pretax_posttax_pairs':1,
                            'countries':[{'wid_area':'US','iso3':'USA',
                                          'source_sha256':original,'source_native_rows':3,
                                          'pretax_posttax_pairs':1,'source_run':'12345'}]}
                  (root/'manifest.json').write_text(json.dumps(manifest))
                  return root/'manifest.json',root/'input',root/'out'
          
              def test_real_numbers_materialized_in_sqlite(self):
                  with tempfile.TemporaryDirectory() as t:
                      m,s,o=self.seed(t)
                      report=build(m,s,o)
                      self.assertEqual(report['actual_numeric_observation_rows_in_sqlite'],3)
                      self.assertEqual(report['actual_matched_pretax_posttax_pairs'],1)
                      with sqlite3.connect(o/'wid_23country_values.sqlite') as db:
                          total=db.execute('SELECT COUNT(*) FROM wid_numeric_observations').fetchone()[0]
                          value=db.execute('''SELECT value_fraction FROM wid_numeric_observations
                              WHERE concept='pretax_national_income_share' ''').fetchone()[0]
                          difference=db.execute('''SELECT posttax_minus_pretax_percentage_points
                              FROM wid_distribution_panel WHERE percentile='p0p50' ''').fetchone()[0]
                          self.assertEqual(total,3)
                          self.assertAlmostEqual(value,0.15)
                          self.assertAlmostEqual(difference,8)
                      self.assertTrue((o/'sha256_manifest.json').exists())
                      self.assertEqual(report['status'],'REAL_NUMERIC_VALUES_IMPORTED_INTO_PRIVATE_RESEARCH_SQLITE_NOT_CANONICAL')
          
              def test_reject_metadata_only_non_numeric(self):
                  with tempfile.TemporaryDirectory() as t:
                      m,s,o=self.seed(t,'text')
                      with self.assertRaisesRegex(ValueError,'Non-numeric observation'):
                          build(m,s,o)
          
              def test_reject_duplicate_measurement(self):
                  with tempfile.TemporaryDirectory() as t:
                      m,s,o=self.seed(t,'duplicate')
                      with self.assertRaisesRegex(ValueError,'Duplicate WID numeric key'):
                          build(m,s,o)
          
              def test_reject_wrong_source_hash(self):
                  with tempfile.TemporaryDirectory() as t:
                      m,s,o=self.seed(t,'bad_sha')
                      with self.assertRaisesRegex(ValueError,'source country/hash mismatch'):
                          build(m,s,o)
          
              def test_reject_missing_source(self):
                  with tempfile.TemporaryDirectory() as t:
                      m,s,o=self.seed(t)
                      (s/'US'/'wid_source_native_shares.csv').unlink()
                      with self.assertRaisesRegex(FileNotFoundError,'NO NUMERIC SOURCE FILE'):
                          build(m,s,o)
          
              def test_reject_false_manifest_counts(self):
                  with tempfile.TemporaryDirectory() as t:
                      m,s,o=self.seed(t)
                      obj=json.loads(m.read_text());obj['expected_numeric_values']=4;m.write_text(json.dumps(obj))
                      with self.assertRaisesRegex(ValueError,'Manifest source-native numeric row totals disagree'):
                          verified_manifest(m)
          
              def test_supported_definition_codes(self):
                  self.assertEqual(parse_variable('sptinc992j'),'pretax_national_income_share')
                  self.assertEqual(parse_variable('sptincj992'),'pretax_national_income_share')
                  self.assertEqual(parse_variable('shwealj992'),'personal_wealth_share')
                  self.assertIsNone(parse_variable('sptinc999i'))
          
          if __name__=='__main__':unittest.main()
          PY_REAL_NUMERIC_TESTS
      - name: Run seven offline tests and commit code plus source manifest only
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_wid_numeric_panel.py' -v
          python -m py_compile research/build_wid_numeric_panel.py
          python - <<'PY_VERIFY'
          import json
          m=json.load(open('research/wid_23_source_manifest.json'))
          assert len(m['countries'])==m['expected_country_count']==23
          assert sum(z['source_native_rows'] for z in m['countries'])==m['expected_numeric_values']==21430
          assert sum(z['pretax_posttax_pairs'] for z in m['countries'])==m['expected_pretax_posttax_pairs']==4408
          print('Source manifest checked: 23 countries, 21,430 real expected values, 4,408 pairs')
          PY_VERIFY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/build_wid_numeric_panel.py research/wid_23_source_manifest.json tests/test_wid_numeric_panel.py
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Code and pinned manifest already committed'
          else
            git commit -m 'Add fail-closed WID 23-country numeric SQLite materialization'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
      - name: Configure pre-existing private OneDrive credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RCLONE_CONFIG_B64" || { echo 'Required OneDrive connection secret missing' >&2; exit 1; }
          sudo apt-get update -qq
          sudo apt-get install -y -qq rclone
          umask 077
          mkdir -p "$RUNNER_TEMP/atlas-wid-rclone"
          printf '%s' "$RCLONE_CONFIG_B64" | base64 --decode > "$RUNNER_TEMP/atlas-wid-rclone/rclone.conf"
          chmod 600 "$RUNNER_TEMP/atlas-wid-rclone/rclone.conf"
          echo "RCLONE_CONFIG=$RUNNER_TEMP/atlas-wid-rclone/rclone.conf" >> "$GITHUB_ENV"
      - name: Retrieve 23 real numeric source CSVs by pinned SHA country paths
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wid-pinned-input"
          python - <<'PY_COUNTRY_PATHS' > "$RUNNER_TEMP/wid_sources.txt"
          import json
          m=json.load(open('research/wid_23_source_manifest.json'))
          for row in m['countries']:
            print(row['wid_area'],row['source_sha256'][:24])
          PY_COUNTRY_PATHS
          BASE='onedrive:Diego/economic research database/atlas/wid-country-pilot-v1'
          while read -r country pin; do
            mkdir -p "$RUNNER_TEMP/wid-pinned-input/$country"
            rclone copyto "$BASE/$country/$pin/wid_source_native_shares.csv" "$RUNNER_TEMP/wid-pinned-input/$country/wid_source_native_shares.csv" --retries 3
            test -s "$RUNNER_TEMP/wid-pinned-input/$country/wid_source_native_shares.csv"
          done < "$RUNNER_TEMP/wid_sources.txt"
          echo 'Retrieved 23 physical CSV files; numeric validations will run next'
      - name: Physically insert numeric WID values into independent SQLite and verify counts
        shell: bash
        run: |
          set -euo pipefail
          python research/build_wid_numeric_panel.py \
            --manifest research/wid_23_source_manifest.json \
            --input-dir "$RUNNER_TEMP/wid-pinned-input" \
            --out "$RUNNER_TEMP/wid-numeric-panel"
          python - <<'PY_SQL_GUARD'
          import json,sqlite3,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'wid-numeric-panel'
          r=json.loads((root/'numeric_value_validation.json').read_text())
          with sqlite3.connect(root/'wid_23country_values.sqlite') as db:
            count=db.execute("SELECT COUNT(*) FROM wid_numeric_observations WHERE typeof(value_fraction)='real'").fetchone()[0]
            actual=db.execute('SELECT COUNT(*) FROM wid_numeric_observations').fetchone()[0]
            assert db.execute('PRAGMA integrity_check').fetchone()[0]=='ok'
          assert count==actual==r['actual_numeric_observation_rows_in_sqlite']==21430
          assert r['actual_matched_pretax_posttax_pairs']==4408
          assert r['country_count']==23
          assert r['canonical_warehouse_modified'] is False
          print('VERIFIED SQL REAL NUMERIC OBSERVATIONS:',count,'MATCHED PRE/POST PAIRS:',4408)
          PY_SQL_GUARD
      - name: Back up actual numeric SQLite and output values privately with SHA256 round-trip
        shell: bash
        run: |
          set -euo pipefail
          LOCAL="$RUNNER_TEMP/wid-numeric-panel"
          REMOTE="onedrive:Diego/economic research database/atlas/wid-23-numeric-panels-v1/run-$GITHUB_RUN_ID"
          for name in wid_23country_values.sqlite value_evidence_2024.csv numeric_value_validation.json sha256_manifest.json; do
            rclone copyto "$LOCAL/$name" "$REMOTE/$name" --retries 3
            localsha="$(sha256sum "$LOCAL/$name" | awk '{print $1}')"
            remotesha="$(rclone cat "$REMOTE/$name" | sha256sum | awk '{print $1}')"
            test "$localsha" = "$remotesha" || { echo "Backup checksum mismatch: $name" >&2; exit 1; }
          done
          printf 'PRIVATE_NUMERIC_SQLITE_VERIFIED=true\n' > "$RUNNER_TEMP/wid-numeric-panel/backup-status.txt"
          echo 'Verified actual SQLite bytes and 2024 value evidence in PRIVATE OneDrive'
      - name: Publish only count/checksum evidence, not numeric records
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p numeric-panel-evidence
          cp "$RUNNER_TEMP/wid-numeric-panel/numeric_value_validation.json" numeric-panel-evidence/
          cp "$RUNNER_TEMP/wid-numeric-panel/backup-status.txt" numeric-panel-evidence/
      - name: Publish evidence report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: wid-23-real-numeric-verified-${{ github.run_number }}
          path: numeric-panel-evidence/
          retention-days: 90
          if-no-files-found: error
      - name: Erase temporary credentials and raw numeric source files
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/atlas-wid-rclone/rclone.conf"
          rm -rf "$RUNNER_TEMP/wid-pinned-input" "$RUNNER_TEMP/wid-numeric-panel" "$RUNNER_TEMP/wid_sources.txt"
