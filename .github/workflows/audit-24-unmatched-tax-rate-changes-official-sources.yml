          MD,2025,pit,5.75,6.5,0.75,Maryland Comptroller,https://services.marylandcomptroller.gov/taxes/en/maryland-income-tax-rates-and-brackets?id=kb_article_view&sysparm_article=KB0010014,,2025,tax_year,Official 2025 tax bracket reference has new top 6.5 percent; verify any implementation timing separately.,True,False,OFFICIAL_RATE_CONTEXT_FOUND_LEGAL_TIMING_NOT_FULLY_VERIFIED
