          SC,2023,pit,6.5,6.4,-0.1,South Carolina Department of Revenue,https://www.dor.sc.gov/index.php/administrative-legislative-regulations-tax-legislative-update-2023,SB 1087; Act 228 of 2022,2023,tax_year,"Official state describes top rate 6.4 in tax year 2023, under contingent phased reductions.",True,False,OFFICIAL_RATE_CONTEXT_FOUND_LEGAL_TIMING_NOT_FULLY_VERIFIED
          UT,2022,cit,4.95,4.85,-0.10,Utah State Tax Commission,https://tax.utah.gov/train/webinars/2023-01-19-presentation.pdf,SB 59 (2022),2022-01-01,tax_period_start,Official State Tax Commission says corporate rate reduced 4.95 to 4.85 for tax years beginning Jan 1 2022.,True,False,OFFICIAL_RATE_CONTEXT_FOUND_LEGAL_TIMING_NOT_FULLY_VERIFIED
          UT,2022,pit,4.95,4.85,-0.10,Utah State Tax Commission,https://tax.utah.gov/train/webinars/2023-01-19-presentation.pdf,SB 59 (2022),2022-01-01,tax_period_start,Official State Tax Commission says individual rate reduced 4.95 to 4.85 for tax years beginning Jan 1 2022.,True,False,OFFICIAL_RATE_CONTEXT_FOUND_LEGAL_TIMING_NOT_FULLY_VERIFIED
          CSV_OFFICIAL_SRC_END
          python -m py_compile analysis/official_state_tax_timing_review.py
      - name: Validate original published audit and download canonical source index
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BASELINE_RUN_ID" =~ ^[0-9]+$ ]] || { echo 'Invalid prior run id'; exit 1; }
          path=$(gh api "repos/$GH_REPO/actions/runs/$BASELINE_RUN_ID" --jq .path)
          branch=$(gh api "repos/$GH_REPO/actions/runs/$BASELINE_RUN_ID" --jq .head_branch)
          test "$path" = '.github/workflows/add-2019-2025-state-tax-source-evidence-v3.yml'
          test "$branch" = main
          mkdir -p downloads/baseline
          gh run download "$BASELINE_RUN_ID" --repo "$GH_REPO" --pattern 'state-tax-2019-2025-source-index-*' --dir downloads/baseline
      - name: Test all 24 keys and SHA256 baseline against actual previous output
        shell: bash
        run: |
          set -euo pipefail
          python analysis/official_state_tax_timing_review.py --self-test \
            --baseline downloads/baseline \
            --reference analysis/official_state_tax_reference_24.csv
      - name: Retrieve and audit 16 candidate state government documents
        shell: bash
        run: |
          set -euo pipefail
          python analysis/official_state_tax_timing_review.py \
            --baseline downloads/baseline \
            --reference analysis/official_state_tax_reference_24.csv \
            --out official_tax_timing_review
      - name: Keep official source-retrieval audit even if source websites fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-state-tax-review-source-audit-${{ github.run_number }}
          path: |
            official_tax_timing_review/
            analysis/official_state_tax_reference_24.csv
            analysis/official_state_tax_timing_review.py
          if-no-files-found: warn
          retention-days: 90
      - name: Verify zero causal claims and archive with checksum
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json,csv
          r=json.loads(Path('official_tax_timing_review/manifest.json').read_text())
          assert r['previous_missing_context_cases']==24
          assert r['unique_states']==14
          assert r['cases_flagged_possible_ITEP_year_alignment_conflict']==4
          assert r['cases_confirmed_as_identified_exogenous_tax_shocks']==0
          with Path('official_tax_timing_review/24_unmatched_rate_changes_government_evidence_review.csv').open(newline='') as f:
              cases=list(csv.DictReader(f))
          assert len(cases)==24 and all(x['is_exogenous_policy_shock']=='False' for x in cases)
          print('PASS: original 24 records retained, four year discrepancies, zero unsupported causal claims')
          PY
          ID="official-tax-timing-review-$(date -u +%Y%m%d)-${GITHUB_RUN_ID}"
          echo "REVIEW_ID=$ID" >> "$GITHUB_ENV"
          mkdir -p audit_archive
          tar -czf "audit_archive/$ID.tar.gz" official_tax_timing_review analysis/official_state_tax_reference_24.csv analysis/official_state_tax_timing_review.py
          (cd audit_archive && sha256sum "$ID.tar.gz" > "$ID.tar.gz.sha256")
          (cd audit_archive && sha256sum -c "$ID.tar.gz.sha256")
      - name: Save versioned review archive in GitHub artifacts
        uses: actions/upload-artifact@v4
        with:
          name: official-state-tax-timing-review-${{ github.run_number }}
          path: audit_archive/
          retention-days: 90
      - name: Back up official-source audit to private OneDrive and verify checksum
        shell: bash
        env:
          RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG_B64 }}
        run: |
          set -euo pipefail
          test -n "$RCLONE_CONFIG_B64" || { echo 'Missing RCLONE_CONFIG_B64'; exit 1; }
          sudo apt-get update -qq
          sudo apt-get install -y -qq rclone
          mkdir -p "$RUNNER_TEMP/rclone"
          chmod 700 "$RUNNER_TEMP/rclone"
          printf '%s' "$RCLONE_CONFIG_B64" | base64 --decode > "$RUNNER_TEMP/rclone/rclone.conf"
          chmod 600 "$RUNNER_TEMP/rclone/rclone.conf"
          export RCLONE_CONFIG="$RUNNER_TEMP/rclone/rclone.conf"
          archive="audit_archive/${REVIEW_ID}.tar.gz"
          target="$ONEDRIVE_TARGET/snapshots/analysis/${REVIEW_ID}.tar.gz"
          rclone copyto "$archive" "$target" --retries 3 --low-level-retries 10
          rclone copyto "$target" "$RUNNER_TEMP/official-tax-audit-verify.tar.gz" --retries 3
          cmp "$archive" "$RUNNER_TEMP/official-tax-audit-verify.tar.gz"
          rclone copyto "audit_archive/${REVIEW_ID}.tar.gz.sha256" "${target}.sha256"
          rclone copyto official_tax_timing_review/manifest.json "$ONEDRIVE_TARGET/snapshots/analysis/${REVIEW_ID}.manifest.json"
          echo "OneDrive verified: $target SHA256=$(sha256sum "$archive" | awk '{print $1}')"
      - name: Delete temporary OneDrive access credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/rclone/rclone.conf"
